# Local development only. No remote project is linked.
# Generated with Supabase CLI 2.122.0, reduced to the services needed for DB preparation.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "turnosmerivo"

[api]
enabled = true
port = 54321
# No internal schemas are exposed. Revisit public/api only after security approval.
schemas = ["public", "api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New public objects require explicit grants in future reviewed migrations.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Local baseline; match the approved remote project's major before writing migrations.
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Enables the email provider; global auth.enable_signup=false still blocks registration.
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.invite]
subject = "Activá tu cuenta de Merivo"
content_path = "./supabase/templates/invite.html"

[auth.mfa]
max_enrolled_factors = 2

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = false

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[local_smtp]
enabled = true
port = 54324

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental.pgdelta]
enabled = false
